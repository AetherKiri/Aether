name: RFVP provider

on:
  pull_request:
    paths:
      - 'packages/rfvp'
      - 'bridge/rfvp_runtime/**'
      - 'abi/include/**'
      - 'apps/godot_app/assets/fonts/**'
      - '.github/workflows/rfvp-provider.yml'
  push:
    branches: [main]
    paths:
      - 'packages/rfvp'
      - 'bridge/rfvp_runtime/**'
      - 'abi/include/**'
      - 'apps/godot_app/assets/fonts/**'
      - '.github/workflows/rfvp-provider.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rfvp-provider-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize public RFVP sources
        run: git submodule update --init packages/rfvp
      - name: Verify runner build tools
        run: cargo --version && cmake --version && ninja --version && pkg-config --modversion alsa
      - name: Prepare isolated host overlay
        run: cmake -S bridge/rfvp_runtime -B out/rfvp-check -G Ninja -DCMAKE_BUILD_TYPE=Debug
      # Temporary bootstrap: the generated public lockfile is collected from
      # this run and committed before this PR can leave draft.
      - name: Resolve updated workspace lockfile
        run: |
          cargo update --workspace --manifest-path out/rfvp-check/prepared/Cargo.toml
          echo RFVP_LOCKFILE_BEGIN
          base64 -w0 out/rfvp-check/prepared/Cargo.lock
          echo
          echo RFVP_LOCKFILE_END
      - name: Check locked Rust dependency graph
        run: cargo check --locked --manifest-path out/rfvp-check/prepared/Cargo.toml -p rfvp --lib --no-default-features --features soft-render-core,audio,native-video,random,image-formats,zlib-flate2
      - name: Build provider
        run: cmake --build out/rfvp-check
      - name: Run host and provider regressions
        run: ctest --test-dir out/rfvp-check --output-on-failure
      - name: Verify upstream remains untouched
        run: test -z "$(git -C packages/rfvp status --porcelain)"
