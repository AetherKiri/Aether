name: Read Ren'Py build diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/renpy-build-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  actual-build-log:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the actual failed source-build evidence
        uses: actions/download-artifact@v6
        with:
          repository: AetherKiri/Aether
          run-id: 37776651799
          name: renpy-source-build-evidence
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/renpy-android-source-evidence
      - name: Read a sanitized summary of the original build logs
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/renpy-android-source-evidence" <<'PY'
          import pathlib, re, sys
          logs = sorted(pathlib.Path(sys.argv[1]).rglob('*.log'))
          if not logs:
              raise SystemExit('The genuine source-build evidence contains no log files.')
          print('Reading preserved evidence from actual job 113309300220; no build is rerun or simulated.')
          remaining = 24000
          for log in logs:
              text = log.read_text(errors='replace')
              text = re.sub(r'\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)', '', text)
              text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
              text = re.sub(r'[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]', '', text)
              lines = text.splitlines()
              interesting = [i for i, line in enumerate(lines)
                             if re.search(r'error:|fatal error|FAILED|Error [1-9]|undefined reference|not found|Traceback|No such file|exception|Killed|process failed|tasks failed', line, re.I)]
              indices = set(range(max(0, len(lines)-110), len(lines)))
              for i in interesting[-16:]:
                  indices.update(range(max(0, i-4), min(len(lines), i+9)))
              summary = '\n'.join(lines[i] for i in sorted(indices))
              print(f'Original log: {log.name}; {len(lines)} lines')
              if len(summary) > remaining:
                  summary = summary[-remaining:]
              print(summary)
              remaining -= len(summary)
              if remaining <= 0:
                  print('Summary reached its display limit; complete original logs remain in the artifact.')
                  break
          PY
      - name: Preserve the original build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: renpy-android-actual-build-log
          path: ${{ runner.temp }}/renpy-android-source-evidence
          if-no-files-found: warn
          retention-days: 7
