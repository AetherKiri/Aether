name: Submodule Auto Update

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'Target commit SHA on main to inspect (default: HEAD)'
        required: false
        default: 'HEAD'
      force_all:
        description: 'Inspect all submodules in repo rather than only changed ones in target commit'
        required: false
        type: boolean
        default: false
      submodule_path:
        description: 'Explicit submodule path to inspect (optional, e.g. packages/AetherKrkr)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: submodule-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-update:
    name: Check & Update Submodules
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
      HAS_AETHERSECRET: ${{ secrets.AETHERSECRET != '' }}
      HAS_SOFTPAL_DEPLOY_KEY: ${{ secrets.AETHER_SOFTPAL_DEPLOY_KEY != '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ (inputs.target_commit != '' && inputs.target_commit != 'HEAD') && 0 || 2 }}
          persist-credentials: true

      - name: Fetch target commit history
        if: ${{ inputs.target_commit != '' && inputs.target_commit != 'HEAD' }}
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          echo "Fetching target commit $TARGET_COMMIT..."
          git fetch --depth=2 origin "$TARGET_COMMIT" || git fetch origin "$TARGET_COMMIT"

      - name: Configure SSH for private submodules
        if: env.HAS_AETHERSECRET == 'true' || env.HAS_SOFTPAL_DEPLOY_KEY == 'true'
        env:
          AETHERSECRET: ${{ secrets.AETHERSECRET }}
          AETHER_SOFTPAL_DEPLOY_KEY: ${{ secrets.AETHER_SOFTPAL_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

          eval "$(ssh-agent -s)"

          if [ -n "$AETHERSECRET" ]; then
            echo "$AETHERSECRET" | tr -d '\r' > ~/.ssh/id_aether_internal
            chmod 600 ~/.ssh/id_aether_internal
            ssh-add ~/.ssh/id_aether_internal
            printf '%s\n' \
              'Host github.com' \
              '  HostName github.com' \
              '  User git' \
              '  IdentityFile ~/.ssh/id_aether_internal' \
              '  IdentitiesOnly yes' \
              '  StrictHostKeyChecking accept-new' >> ~/.ssh/config
          fi

          if [ -n "$AETHER_SOFTPAL_DEPLOY_KEY" ]; then
            echo "$AETHER_SOFTPAL_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/id_aether_softpal
            chmod 600 ~/.ssh/id_aether_softpal
            printf '%s\n' \
              'Host github-softpal' \
              '  HostName github.com' \
              '  User git' \
              '  IdentityFile ~/.ssh/id_aether_softpal' \
              '  IdentitiesOnly yes' \
              '  StrictHostKeyChecking accept-new' >> ~/.ssh/config
            git config --global url."git@github-softpal:AetherKiri/AetherSoftPal".insteadOf "git@github.com:AetherKiri/AetherSoftPal"
          fi

          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Check submodule updates
        id: check
        env:
          INPUT_TARGET_COMMIT: ${{ inputs.target_commit }}
          INPUT_FORCE_ALL: ${{ inputs.force_all }}
          INPUT_SUBMODULE_PATH: ${{ inputs.submodule_path }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cmd=(python3 .github/scripts/check-submodule-updates.py)
          if [ -n "$INPUT_TARGET_COMMIT" ]; then
            cmd+=(--commit "$INPUT_TARGET_COMMIT")
          else
            cmd+=(--commit "HEAD")
          fi
          if [ "$INPUT_FORCE_ALL" = "true" ]; then
            cmd+=(--all)
          fi
          if [ -n "$INPUT_SUBMODULE_PATH" ]; then
            cmd+=(--submodule "$INPUT_SUBMODULE_PATH")
          fi
          cmd+=(--run-number "$GITHUB_RUN_NUMBER")
          cmd+=(--apply)
          cmd+=(--github-output "$GITHUB_OUTPUT")
          cmd+=(--github-summary "$GITHUB_STEP_SUMMARY")
          cmd+=(--pr-body-file "${RUNNER_TEMP}/submodule_pr_body.md")
          cmd+=(--commit-msg-file "${RUNNER_TEMP}/submodule_commit_msg.txt")
          "${cmd[@]}"

      - name: Close existing PR and open new pull request
        if: steps.check.outputs.has_updates == 'true'
        env:
          BRANCH: ${{ steps.check.outputs.branch_name }}
          BRANCH_PREFIX: ${{ steps.check.outputs.branch_prefix }}
          TITLE: ${{ steps.check.outputs.pr_title }}
          PR_BODY_FILE: ${{ steps.check.outputs.pr_body_file }}
          COMMIT_MSG_FILE: ${{ steps.check.outputs.commit_msg_file }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Close any existing open PRs created for this submodule update
          echo "Checking for existing open PRs with prefix '$BRANCH_PREFIX'..."
          old_prs="$(gh pr list --base main --state open --json number,headRefName --jq ".[] | select(.headRefName | startswith(\"$BRANCH_PREFIX\")) | .number")"
          for pr in $old_prs; do
            echo "Closing superseded PR #$pr..."
            gh pr close "$pr" --comment "Superseded by newer submodule update in run #${GITHUB_RUN_NUMBER}. Opening fresh PR." --delete-branch || true
          done

          echo "Switching to new branch: $BRANCH"
          git checkout -B "$BRANCH"

          echo "Committing updated submodule gitlinks..."
          git commit -F "$COMMIT_MSG_FILE"

          echo "Pushing new branch to remote..."
          git push origin "$BRANCH" --force

          echo "Opening fresh pull request for branch $BRANCH..."
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body-file "$PR_BODY_FILE"
