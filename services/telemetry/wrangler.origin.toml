name = "aether-telemetry"
main = "worker/index.mjs"
compatibility_date = "2026-11-24"
preview_urls = false
logpush = false

[observability]
enabled = false

[triggers]
crons = ["17 * * * *"]

[vars]
TELEMETRY_ORIGIN_URL = "https://replace-with-your-validator.example"

[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "aether-telemetry"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
