name: 功能建议 / Feature request
description: 分享你希望解决的问题或使用场景 / Share a need or use case.
title: "[Feature Request] "
type: Feature
body:
  - type: textarea
    id: use-case
    attributes:
      label: 需求或使用场景 / Need or use case
      description: 遇到了什么问题，或希望完成什么事情？只描述需求也可以，无需先设计解决方案。 / What problem are you facing, or what are you trying to do? You can describe the need without proposing a solution.
    validations:
      required: true
  - type: textarea
    id: proposed-feature
    attributes:
      label: 期望的功能 / Proposed feature
      description: 如果已有想法，请描述希望加入的功能或交互。 / If you have an idea, describe the feature or interaction you would like.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代办法 / Alternatives
      description: 你目前如何处理这个需求，或考虑过哪些替代办法？ / How do you handle this need today, or what alternatives have you considered?
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: 补充材料 / Additional context
      description: 可添加参考链接、截图或示意。 / Add reference links, screenshots, or sketches.
    validations:
      required: false
