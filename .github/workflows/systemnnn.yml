name: SystemNNN native

on:
  pull_request:
    paths:
      - 'packages/SystemNNN-Emberfall'
      - 'bridge/systemnnn_runtime/**'
      - 'tests/systemnnn_native/**'
      - 'tests/systemnnn_presenter_test.cpp'
      - 'tests/CMakeLists.txt'
      - 'abi/**'
      - 'cmake/AetherKiriRuntimes.cmake'
      - 'CMakeLists.txt'
      - 'vcpkg-configuration.json'
      - 'vcpkg.json'
      - 'bridge/godot_extension/CMakeLists.txt'
      - 'scripts/build_*.sh'
      - 'apps/godot_app/scripts/**'
      - 'apps/godot_app/tests/systemnnn_library_test.gd'
      - 'apps/godot_app/tests/runtime_player_reopen_test.gd'
      - 'apps/godot_app/assets/fonts/**'
      - 'bridge/godot_extension/src/aether_runtime_player.*'
      - 'tools/check_ctest_inventory.py'
      - '.gitmodules'
      - '.github/workflows/systemnnn.yml'
  push:
    branches: [main]
    paths:
      - 'packages/SystemNNN-Emberfall'
      - 'bridge/systemnnn_runtime/**'
      - 'tests/systemnnn_native/**'
      - 'tests/systemnnn_presenter_test.cpp'
      - 'tests/CMakeLists.txt'
      - 'abi/**'
      - 'cmake/AetherKiriRuntimes.cmake'
      - 'CMakeLists.txt'
      - 'vcpkg-configuration.json'
      - 'vcpkg.json'
      - 'bridge/godot_extension/CMakeLists.txt'
      - 'scripts/build_*.sh'
      - 'apps/godot_app/scripts/**'
      - 'apps/godot_app/tests/systemnnn_library_test.gd'
      - 'apps/godot_app/tests/runtime_player_reopen_test.gd'
      - 'apps/godot_app/assets/fonts/**'
      - 'bridge/godot_extension/src/aether_runtime_player.*'
      - 'tools/check_ctest_inventory.py'
      - '.gitmodules'
      - '.github/workflows/systemnnn.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: systemnnn-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native (${{ matrix.os }}, ${{ matrix.dependencies }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            dependencies: apt
          - os: macos-latest
            dependencies: brew
          - os: windows-latest
            dependencies: vcpkg
    defaults:
      run:
        shell: bash
    env:
      ALSOFT_DRIVERS: 'null'
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.systemnnn-vcpkg-cache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize only SystemNNN sources
        run: git submodule update --init --recursive --depth 1 packages/SystemNNN-Emberfall
      - name: Install Linux dependencies
        if: matrix.dependencies == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config python3 default-jdk-headless libpng-dev zlib1g-dev \
            libfreetype-dev libopenal-dev nlohmann-json3-dev libfmt-dev libspdlog-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev ffmpeg
      - name: Install macOS dependencies
        if: matrix.dependencies == 'brew'
        run: |
          brew install cmake ninja pkgconf libpng zlib freetype libiconv openal-soft \
            nlohmann-json fmt spdlog ffmpeg
          echo "CMAKE_PREFIX_PATH=$(brew --prefix):$(brew --prefix libiconv):$(brew --prefix openal-soft):$(brew --prefix zlib)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg)/lib/pkgconfig:$(brew --prefix openal-soft)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Read Aether vcpkg baseline
        if: matrix.dependencies == 'vcpkg'
        id: baseline
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          baseline = json.loads(Path("vcpkg-configuration.json").read_text())["default-registry"]["baseline"]
          manifest = json.loads(Path("tests/systemnnn_native/vcpkg.json").read_text())
          if manifest["builtin-baseline"] != baseline:
              raise SystemExit("SystemNNN manifest must use the Aether vcpkg baseline")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"commit={baseline}\n")
          PY
      - name: Checkout pinned vcpkg
        if: matrix.dependencies == 'vcpkg'
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.commit }}
          path: .systemnnn-vcpkg
          persist-credentials: false
      - name: Restore focused vcpkg binaries
        if: matrix.dependencies == 'vcpkg'
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: .systemnnn-vcpkg-cache
          key: systemnnn-${{ runner.os }}-static-md-${{ steps.baseline.outputs.commit }}-${{ hashFiles('tests/systemnnn_native/vcpkg.json') }}
      - name: Bootstrap vcpkg
        if: matrix.dependencies == 'vcpkg'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & ./.systemnnn-vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure with system dependencies
        if: matrix.dependencies != 'vcpkg'
        run: |
          system_args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            system_args+=(
              "-DOPENAL_INCLUDE_DIR=$(brew --prefix openal-soft)/include"
              "-DOPENAL_LIBRARY=$(brew --prefix openal-soft)/lib/libopenal.dylib"
            )
          fi
          cmake -S tests/systemnnn_native -B build/systemnnn-native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON "${system_args[@]}"
      - name: Configure with minimal vcpkg manifest
        if: matrix.dependencies == 'vcpkg'
        id: vcpkg-configure
        # Static third-party libraries with the DLL CRT match shared engine_api.
        run: >-
          cmake -S tests/systemnnn_native -B build/systemnnn-native -A x64
          -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/.systemnnn-vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_MANIFEST_DIR="${GITHUB_WORKSPACE}/tests/systemnnn_native"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON
          -DVCPKG_INSTALLED_DIR="${GITHUB_WORKSPACE}/build/systemnnn-native/vcpkg_installed"
          -DOPENAL_INCLUDE_DIR="${GITHUB_WORKSPACE}/build/systemnnn-native/vcpkg_installed/x64-windows-static-md/include"
          -DOPENAL_LIBRARY="${GITHUB_WORKSPACE}/build/systemnnn-native/vcpkg_installed/x64-windows-static-md/lib/OpenAL32.lib"
      - name: Save focused vcpkg binaries
        if: ${{ !cancelled() && matrix.dependencies == 'vcpkg' && steps.vcpkg-configure.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .systemnnn-vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Build Release contracts
        run: cmake --build build/systemnnn-native --config Release --parallel 2
      - name: Require native helper contracts
        run: |
          ctest --test-dir build/systemnnn-native -C Release --show-only=json-v1 > build/systemnnn-native/inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          inventory = json.loads(Path("build/systemnnn-native/inventory.json").read_text())
          expected = {f"systemnnn-{name}-contract" for name in ("provider", "text", "startup", "progress", "audio", "presenter", "native-panel", "minigame", "minigame-binding")}
          observed = {Path(test["command"][0]).stem for test in inventory["tests"] if test.get("command")}
          missing = expected - observed
          if missing:
              raise SystemExit(f"Missing native contract executables: {sorted(missing)}")
          if os.environ["RUNNER_OS"] == "Linux":
              names = {test["name"] for test in inventory["tests"]}
              for required in ("systemnnn-progress-java-contract", "systemnnn-minigame-java-contract"):
                  if required not in names:
                      raise SystemExit(f"Missing Java compatibility contract: {required}")
          print(f"Required native contracts found: {sorted(expected)}")
          PY
      - name: Run native contracts
        run: >-
          ctest --test-dir build/systemnnn-native -C Release
          --output-on-failure --no-tests=error --timeout 240
      - name: Run generated movie fixtures
        if: matrix.dependencies == 'apt'
        run: bash bridge/systemnnn_runtime/tests/run_movie_test.sh
      - name: Verify pinned runtime sources remain unchanged
        if: always()
        run: test -z "$(git -C packages/SystemNNN-Emberfall status --porcelain)"

  godot-shell:
    name: Godot 4.6 shell (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Download exact Godot 4.6-stable
        run: |
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.6-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Prepare shell-only project
        run: |
          shell_project="$RUNNER_TEMP/systemnnn-shell"
          mkdir -p "$shell_project"
          cp -R apps/godot_app/scripts apps/godot_app/tests apps/godot_app/assets "$shell_project/"
          printf 'config_version=5\n[application]\nconfig/name="SystemNNN shell tests"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > "$shell_project/project.godot"
          echo "SHELL_PROJECT=$shell_project" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version | grep -E '^4\.6\.stable\.'
          timeout 120 "$GODOT_BIN" --headless --editor --path "$shell_project" --import
      - name: Run shell contracts without native extension
        run: |
          set -euo pipefail
          for suite in systemnnn_library runtime_player_reopen; do
            log="$RUNNER_TEMP/${suite}.log"
            timeout 60 "$GODOT_BIN" --headless --path "$SHELL_PROJECT" \
              --script "res://tests/${suite}_test.gd" 2>&1 | tee "$log"
            grep -Fx "${suite^^}_OK" "$log"
            if grep -E 'SCRIPT ERROR:|^ERROR:' "$log"; then
              exit 1
            fi
          done
          for suite in runtime_form_dialog; do
            log="$RUNNER_TEMP/${suite}.log"
            timeout 60 "$GODOT_BIN" --headless --path "$SHELL_PROJECT" \
              --script "res://tests/${suite}_test.gd" 2>&1 | tee "$log"
            grep -Fx "${suite}_test: PASS" "$log"
            if grep -E 'SCRIPT ERROR:|^ERROR:' "$log"; then exit 1; fi
          done
          for suite in game_launch_entry game_input_mapping; do
            log="$RUNNER_TEMP/${suite}.log"
            timeout 60 "$GODOT_BIN" --headless --path "$SHELL_PROJECT" \
              --script "res://scripts/${suite}_test.gd" 2>&1 | tee "$log"
            grep -Fx "${suite}_test: PASS" "$log"
            if grep -E 'SCRIPT ERROR:|^ERROR:' "$log"; then
              exit 1
            fi
          done
