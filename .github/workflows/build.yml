name: Build

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'doc/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        description: SemVer tag injected into every application artifact
        required: false
        type: string
        default: ''
      release_build_number:
        description: Base GitHub run number used to derive the store build number
        required: false
        type: string
        default: ''
    secrets:
      AETHERSECRET:
        required: false
      AETHERID:
        required: false
      ANDROID_RELEASE_KEYSTORE_BASE64:
        required: false
      ANDROID_RELEASE_KEYSTORE_ALIAS:
        required: false
      ANDROID_RELEASE_KEYSTORE_PASSWORD:
        required: false
      IOS_DISTRIBUTION_CERTIFICATE_BASE64:
        required: false
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:
        required: false
      IOS_PROVISIONING_PROFILE_BASE64:
        required: false
      MACOS_INSTALLER_CERTIFICATE_BASE64:
        required: false
      MACOS_INSTALLER_CERTIFICATE_PASSWORD:
        required: false
      MACOS_PROVISIONING_PROFILE_BASE64:
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # GitHub does not expose repository secrets to fork or Dependabot pull
  # requests. Trusted runs build the complete internal product; untrusted
  # pull requests retain the public fallback without exposing the SSH key.
  AETHERKIRI_WITH_INTERNAL: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
  # Forward the checkout decision to build.sh so a stale or partial package
  # checkout cannot accidentally enable private extensions in public builds.
  AETHERKIRI_ENABLE_INTERNAL: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
  # Trusted same-repository changes may populate the package cache. Fork and
  # Dependabot pull requests receive read-only package access.
  AETHERKIRI_VCPKG_CACHE_WRITE: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
  AETHERKIRI_RELEASE_VERSION: ${{ inputs.release_version || '' }}
  AETHERKIRI_BUILD_NUMBER: ${{ inputs.release_build_number || github.run_number }}
  AETHERKIRI_BUILD_ATTEMPT: ${{ github.run_attempt }}
  AETHER_IOS_BUNDLE_ID: ${{ secrets.AETHERID || 'com.liuyu.aether.aether' }}
  AETHER_APP_BUNDLE_ID: ${{ secrets.AETHERID || 'com.liuyu.aether.aether' }}

jobs:
  android:
    name: Build Android App
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      GODOT_RELEASE: 4.7-stable
      GODOT_TEMPLATE_VERSION: 4.7.stable
      ANDROID_NDK_VERSION: 28.1.13356709

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: ${{ env.AETHERKIRI_WITH_INTERNAL == 'true' && 'recursive' || 'false' }}
          ssh-key: ${{ env.AETHERKIRI_WITH_INTERNAL == 'true' && secrets.AETHERSECRET || '' }}
          persist-credentials: false

      - name: Set up Rust for Minori
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Resolve private runtime dependency cache
        id: private-runtime-cache-key
        if: env.AETHERKIRI_WITH_INTERNAL == 'true'
        run: |
          key="$(packages/AetherInternal/tools/prepare_ci_dependencies.sh \
            --platform android --print-cache-key)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore private runtime dependencies
        if: env.AETHERKIRI_WITH_INTERNAL == 'true'
        uses: actions/cache@v5
        with:
          path: packages/AetherInternal/.ci-cache/runtime-dependencies/android
          key: ${{ runner.os }}-${{ steps.private-runtime-cache-key.outputs.key }}

      - name: Initialize private runtime dependencies
        if: env.AETHERKIRI_WITH_INTERNAL == 'true'
        run: packages/AetherInternal/tools/prepare_ci_dependencies.sh --platform android

      - name: Initialize public runtime packages
        if: env.AETHERKIRI_WITH_INTERNAL != 'true'
        run: |
          git submodule update --init --depth 1 packages/OnscripterYuri
          git -c submodule.packages/psdfile.url=https://github.com/AetherKiri/psdfile.git \
            submodule update --init --recursive --depth 1 packages/psdfile
          git submodule update --init --depth 1 packages/AetherSiglus

      - name: Set application release version
        if: env.AETHERKIRI_RELEASE_VERSION != ''
        run: |
          release_build_number=$((AETHERKIRI_BUILD_NUMBER * 100 + AETHERKIRI_BUILD_ATTEMPT))
          python3 .github/scripts/set-release-version.py \
            "$AETHERKIRI_RELEASE_VERSION" \
            --build-number "$release_build_number" \
            --github-env "$GITHUB_ENV"

      - name: Verify AetherInternal package
        if: env.AETHERKIRI_WITH_INTERNAL == 'true'
        run: |
          set -euo pipefail
          test -f packages/AetherInternal/cmake/AetherInternalConfig.cmake
          git submodule status --recursive

      - name: Install Build Systems
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config autoconf autoconf-archive automake libtool gettext bison flex curl unzip zip zstd ccache jq mono-complete
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-android-ccache-v2
          restore-keys: |
            ${{ runner.os }}-android-ccache-

      - name: Setup ccache config
        run: |
          ccache --max-size=400M
          ccache --cleanup
          ccache -z

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v6
        with:
          # OnscripterYuri pins SDL at da19244f; that revision contains an
          # upstream-generated wrapper which is not in Gradle's checksum list.
          allow-checksums: 2c23278a62dc9f96ab11bee897d9f53e6479d6419135e4560ce822a6431df5e5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Validation is performed explicitly above so the pinned SDL wrapper
          # can be allowed without disabling checks for every other wrapper.
          validate-wrappers: false

      - name: Install Godot export tools
        run: |
          set -euo pipefail
          mkdir -p .godot "${RUNNER_TEMP}/godot-templates"
          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors \
            -o "${RUNNER_TEMP}/godot-linux.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -tq "${RUNNER_TEMP}/godot-linux.zip"
          unzip -q "${RUNNER_TEMP}/godot-linux.zip" -d .godot
          godot_bin="$(find .godot -maxdepth 1 -type f -name 'Godot*_linux.x86_64' | head -1)"
          if [[ -z "$godot_bin" ]]; then
            echo "Godot Linux binary not found after unzip" >&2
            exit 1
          fi
          chmod +x "$godot_bin"

          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors \
            -o "${RUNNER_TEMP}/godot-export-templates.tpz" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -tq "${RUNNER_TEMP}/godot-export-templates.tpz"
          unzip -q "${RUNNER_TEMP}/godot-export-templates.tpz" -d "${RUNNER_TEMP}/godot-templates"
          template_dir="${HOME}/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "${template_dir}"
          cp -a "${RUNNER_TEMP}/godot-templates/templates/." "${template_dir}/"

          echo "GODOT_BIN=${GITHUB_WORKSPACE}/${godot_bin}" >> "$GITHUB_ENV"
          echo "GODOT_TEMPLATE_DIR=${template_dir}" >> "$GITHUB_ENV"

      - name: Set up Android SDK and pinned NDK
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_HOME:-}" ]]; then
            if [[ -d "$HOME/Android/Sdk" ]]; then
              echo "ANDROID_HOME=$HOME/Android/Sdk" >> "$GITHUB_ENV"
            elif [[ -d "/usr/local/lib/android/sdk" ]]; then
              echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            fi
          else
            echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          fi

          sdk_root="${ANDROID_HOME:-${HOME}/Android/Sdk}"
          ndk_root="${sdk_root}/ndk/${ANDROID_NDK_VERSION}"
          if [[ ! -f "${ndk_root}/build/cmake/android.toolchain.cmake" ]]; then
            sdkmanager_bin="$(find "${sdk_root}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -1)"
            if [[ -z "${sdkmanager_bin}" ]]; then
              echo "Android sdkmanager not found under ${sdk_root}" >&2
              exit 1
            fi
            set +o pipefail
            yes | "${sdkmanager_bin}" "ndk;${ANDROID_NDK_VERSION}"
            sdkmanager_status=${PIPESTATUS[1]}
            set -o pipefail
            if [[ "${sdkmanager_status}" -ne 0 ]]; then
              exit "${sdkmanager_status}"
            fi
          fi
          if [[ ! -f "${ndk_root}/build/cmake/android.toolchain.cmake" ]]; then
            echo "Pinned Android NDK ${ANDROID_NDK_VERSION} was not installed" >&2
            exit 1
          fi
          echo "ANDROID_NDK_HOME=${ndk_root}" >> "$GITHUB_ENV"

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          if [[ -d ".devtools/vcpkg" && ! -d ".devtools/vcpkg/.git" ]]; then
            rm -rf .devtools/vcpkg
          fi
          if [[ ! -d ".devtools/vcpkg/.git" ]]; then
            mkdir -p .devtools
            git clone https://github.com/microsoft/vcpkg.git .devtools/vcpkg
          fi
          if [[ ! -x ".devtools/vcpkg/vcpkg" ]]; then
            (cd .devtools/vcpkg && ./bootstrap-vcpkg.sh -disableMetrics)
          fi
          echo "VCPKG_ROOT=${GITHUB_WORKSPACE}/.devtools/vcpkg" >> "$GITHUB_ENV"

      - name: Configure vcpkg binary cache
        env:
          VCPKG_PACKAGES_TOKEN: ${{ github.token }}
        run: bash .github/scripts/configure-vcpkg-binary-cache.sh "$VCPKG_ROOT/vcpkg"

      - name: Configure Android signing
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_ALIAS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_ALIAS }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          signing_dir="${RUNNER_TEMP}/android-signing"
          mkdir -p "$signing_dir"

          release_secret_count=0
          [[ -n "${ANDROID_RELEASE_KEYSTORE_BASE64}" ]] && release_secret_count=$((release_secret_count + 1))
          [[ -n "${ANDROID_RELEASE_KEYSTORE_ALIAS}" ]] && release_secret_count=$((release_secret_count + 1))
          [[ -n "${ANDROID_RELEASE_KEYSTORE_PASSWORD}" ]] && release_secret_count=$((release_secret_count + 1))

          if [[ "$release_secret_count" -eq 0 ]]; then
            echo "Android release signing secrets are not configured; building unsigned release APK."
            echo "ANDROID_RELEASE_SIGNED=0" >> "$GITHUB_ENV"
            {
              echo "### Android signing"
              echo ""
              echo "Release signing secrets were not available, so CI built an unsigned release APK."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$release_secret_count" -ne 3 ]]; then
            echo "Android release signing secrets are incomplete. Configure all or none of ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_RELEASE_KEYSTORE_ALIAS, and ANDROID_RELEASE_KEYSTORE_PASSWORD." >&2
            exit 1
          fi

          release_keystore="${signing_dir}/release.keystore"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > "$release_keystore"
          chmod 600 "$release_keystore"
          keytool -list \
            -keystore "$release_keystore" \
            -storepass "$ANDROID_RELEASE_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_RELEASE_KEYSTORE_ALIAS" >/dev/null

          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$release_keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=$ANDROID_RELEASE_KEYSTORE_ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$ANDROID_RELEASE_KEYSTORE_PASSWORD"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$release_keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ANDROID_RELEASE_KEYSTORE_ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$ANDROID_RELEASE_KEYSTORE_PASSWORD"
            echo "ANDROID_RELEASE_SIGNED=1"
          } >> "$GITHUB_ENV"
          perl -0pi -e 's/(name="Android Release".*?package\/signed=)false/${1}true/s' apps/godot_app/export_presets.cfg

      - name: Build Android Release
        run: |
          set -euo pipefail
          chmod +x ./build.sh
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export NDK_CCACHE=ccache
          ./build.sh android release --jobs=4

      - name: Build Android Debug
        run: |
          set -euo pipefail
          chmod +x ./build.sh
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export NDK_CCACHE=ccache
          ./build.sh android debug --jobs=4

      - name: Verify exported APKs
        run: |
          set -euo pipefail
          test -f out/godot/android/release/Aether-release.apk
          test -f out/godot/android/debug/Aether-debug.apk

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: out/godot/android/release/Aether-release.apk
          retention-days: 7

      - name: Save ccache
        if: success() && github.event_name != 'pull_request' && steps.restore-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-android-ccache-v2

  ios:
    name: Build iOS App
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      GODOT_RELEASE: 4.7-stable
      GODOT_TEMPLATE_VERSION: 4.7.stable

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: ${{ env.AETHERKIRI_WITH_INTERNAL == 'true' && 'recursive' || 'false' }}
          ssh-key: ${{ env.AETHERKIRI_WITH_INTERNAL == 'true' && secrets.AETHERSECRET || '' }}
          persist-credentials: false

      - name: Set up Rust for Minori
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Resolve private runtime dependency cache
        id: private-runtime-cache-key
        if: env.AETHERKIRI_WITH_INTERNAL == 'true'
        run: |
          key="$(packages/AetherInternal/tools/prepare_ci_dependencies.sh \
            --platform apple --print-cache-key)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore private runtime dependencies
        if: env.AETHERKIRI_WITH_INTERNAL == 'true'
        uses: actions/cache@v5
        with:
          path: packages/AetherInternal/.ci-cache/runtime-dependencies/apple
          key: ${{ runner.os }}-${{ steps.private-runtime-cache-key.outputs.key }}

      - name: Initialize private runtime dependencies
        if: env.AETHERKIRI_WITH_INTERNAL == 'true'
        run: packages/AetherInternal/tools/prepare_ci_dependencies.sh --platform apple

      - name: Initialize public runtime packages
        if: env.AETHERKIRI_WITH_INTERNAL != 'true'
        run: |
          git submodule update --init --depth 1 packages/OnscripterYuri
          git -c submodule.packages/psdfile.url=https://github.com/AetherKiri/psdfile.git \
            submodule update --init --recursive --depth 1 packages/psdfile
          git submodule update --init --depth 1 packages/AetherSiglus

      - name: Set application release version
        if: env.AETHERKIRI_RELEASE_VERSION != ''
        run: |
          release_build_number=$((AETHERKIRI_BUILD_NUMBER * 100 + AETHERKIRI_BUILD_ATTEMPT))
          python3 .github/scripts/set-release-version.py \
            "$AETHERKIRI_RELEASE_VERSION" \
            --build-number "$release_build_number" \
            --github-env "$GITHUB_ENV"

      - name: Verify iOS 26 release toolchain
        if: env.AETHERKIRI_RELEASE_VERSION != ''
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          sdk_major="${sdk_version%%.*}"
          if ((sdk_major < 26)); then
            echo "Release builds require the iOS 26 SDK or newer; found $sdk_version." >&2
            exit 1
          fi
          echo "Release will use iOS SDK $sdk_version."

      - name: Check App Store signing configuration
        if: env.AETHERKIRI_RELEASE_VERSION != ''
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          configured=0
          [[ -n "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" ]] && configured=$((configured + 1))
          [[ -n "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" ]] && configured=$((configured + 1))
          [[ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]] && configured=$((configured + 1))
          if [[ "$configured" -ne 3 ]]; then
            echo "Tagged releases require all three iOS App Store signing secrets." >&2
            exit 1
          fi
          echo "IOS_APP_STORE_SIGNING=1" >> "$GITHUB_ENV"

      - name: Verify AetherInternal package
        if: env.AETHERKIRI_WITH_INTERNAL == 'true'
        run: |
          set -euo pipefail
          test -f packages/AetherInternal/cmake/AetherInternalConfig.cmake
          git submodule status --recursive

      - name: Install Build Systems
        run: |
          brew install cmake ninja pkg-config autoconf automake autoconf-archive libtool gettext coreutils bison nasm ccache mono
          echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Install Godot export tools
        run: |
          set -euo pipefail
          mkdir -p .godot "${RUNNER_TEMP}/godot-templates"
          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors \
            -o "${RUNNER_TEMP}/godot-macos.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_macos.universal.zip"
          unzip -tq "${RUNNER_TEMP}/godot-macos.zip"
          unzip -q "${RUNNER_TEMP}/godot-macos.zip" -d .godot
          chmod +x ".godot/Godot.app/Contents/MacOS/Godot"

          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors \
            -o "${RUNNER_TEMP}/godot-export-templates.tpz" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -tq "${RUNNER_TEMP}/godot-export-templates.tpz"
          unzip -q "${RUNNER_TEMP}/godot-export-templates.tpz" -d "${RUNNER_TEMP}/godot-templates"
          template_dir="${HOME}/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "${template_dir}"
          cp -a "${RUNNER_TEMP}/godot-templates/templates/." "${template_dir}/"

          echo "GODOT_BIN=${GITHUB_WORKSPACE}/.godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          echo "GODOT_EXPORT_TEMPLATE=${template_dir}/ios.zip" >> "$GITHUB_ENV"

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-ios-ccache-v2
          restore-keys: |
            ${{ runner.os }}-ios-ccache-

      - name: Setup ccache config
        run: |
          ccache --max-size=400M
          ccache --cleanup
          ccache -z

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          if [[ -d ".devtools/vcpkg" && ! -f ".devtools/vcpkg/.vcpkg-root" ]]; then
            rm -rf .devtools/vcpkg
          fi
          if [[ ! -d ".devtools/vcpkg/.git" ]]; then
            mkdir -p .devtools
            git clone https://github.com/microsoft/vcpkg.git .devtools/vcpkg
          fi
          if [[ ! -x ".devtools/vcpkg/vcpkg" ]]; then
            (cd .devtools/vcpkg && ./bootstrap-vcpkg.sh -disableMetrics)
          fi
          echo "VCPKG_ROOT=${GITHUB_WORKSPACE}/.devtools/vcpkg" >> "$GITHUB_ENV"

      - name: Configure vcpkg binary cache
        env:
          VCPKG_PACKAGES_TOKEN: ${{ github.token }}
        run: bash .github/scripts/configure-vcpkg-binary-cache.sh "$VCPKG_ROOT/vcpkg"

      - name: Build iOS Release
        run: |
          set -euo pipefail
          chmod +x ./build.sh
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          ./build.sh ios release --jobs=4 --package-ipa 2>&1 | tee "${RUNNER_TEMP}/ios-release-build.log"
          if grep -E "SCRIPT ERROR|Failed to load script|Can't open GDExtension|Can't open dynamic library" "${RUNNER_TEMP}/ios-release-build.log"; then
            echo "Godot iOS release export logged script or GDExtension load errors." >&2
            exit 1
          fi

      - name: Package App Store IPA
        if: env.IOS_APP_STORE_SIGNING == '1'
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          AETHER_APPLE_TEAM_ID: 3JL7FE9XQT
        run: |
          .github/scripts/package-ios-app-store.sh \
            out/godot/ios/release/Aether.xcodeproj \
            out/godot/ios/release

      - name: Verify iOS Release ABI surface
        run: |
          set -euo pipefail
          release_binary="${RUNNER_TEMP}/Aether-release"
          unzip -p \
            out/godot/ios/release/Aether-Release-Unsigned.ipa \
            Payload/Aether.app/Aether > "$release_binary"
          test -s "$release_binary"
          exported_symbols="$(xcrun nm -gjU "$release_binary")"
          if grep -E '^_engine_' <<< "$exported_symbols"; then
            echo "The private engine C ABI remains dynamically exported." >&2
            exit 1
          fi
          if xcrun nm -m "$release_binary" 2>/dev/null | grep -q 'non-external'; then
            echo "Local symbols remain in the packaged iOS executable." >&2
            exit 1
          fi
          xcrun otool -hv "$release_binary"
          info_plist="${RUNNER_TEMP}/Aether-release-Info.plist"
          unzip -p \
            out/godot/ios/release/Aether-Release-Unsigned.ipa \
            Payload/Aether.app/Info.plist > "$info_plist"
          bluetooth_purpose="$(
            plutil -extract NSBluetoothAlwaysUsageDescription raw "$info_plist" \
              2>/dev/null || true
          )"
          if [[ -z "$bluetooth_purpose" ]]; then
            echo "The packaged iOS release is missing its Bluetooth purpose string." >&2
            exit 1
          fi
          uses_non_exempt_encryption="$(
            plutil -extract ITSAppUsesNonExemptEncryption raw "$info_plist" \
              2>/dev/null || true
          )"
          if [[ "$uses_non_exempt_encryption" != "false" ]]; then
            echo "The packaged iOS release is missing the exempt-encryption declaration." >&2
            exit 1
          fi
          if [[ -n "$AETHERKIRI_RELEASE_VERSION" ]]; then
            actual_bundle_id="$(plutil -extract CFBundleIdentifier raw "$info_plist")"
            actual_version="$(plutil -extract CFBundleShortVersionString raw "$info_plist")"
            actual_build="$(plutil -extract CFBundleVersion raw "$info_plist")"
            if [[ "$actual_bundle_id" != "$AETHER_IOS_BUNDLE_ID" ||
                  "$actual_version" != "$AETHER_APPLE_VERSION" ||
                  "$actual_build" != "$AETHER_BUILD_NUMBER" ]]; then
              echo "The packaged iOS release metadata does not match the tag." >&2
              exit 1
            fi
          fi

      - name: Build iOS Debug
        run: |
          set -euo pipefail
          chmod +x ./build.sh
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          ./build.sh ios debug --jobs=4 --package-ipa 2>&1 | tee "${RUNNER_TEMP}/ios-debug-build.log"
          if grep -E "SCRIPT ERROR|Failed to load script|Can't open GDExtension|Can't open dynamic library" "${RUNNER_TEMP}/ios-debug-build.log"; then
            echo "Godot iOS debug export logged script or GDExtension load errors." >&2
            exit 1
          fi

      - name: Verify exported Xcode project and IPA
        run: |
          set -euo pipefail
          for build_type in release debug; do
            if [[ ! -d "out/godot/ios/${build_type}/Aether.xcodeproj" ]]; then
              echo "Godot iOS ${build_type} Xcode project not found" >&2
              exit 1
            fi
            if [[ ! -d "out/godot/ios/${build_type}/Aether" ]]; then
              echo "Godot iOS ${build_type} project sources not found" >&2
              exit 1
            fi
            build_type_cap="$(echo "${build_type:0:1}" | tr '[:lower:]' '[:upper:]')${build_type:1}"
            if [[ ! -f "out/godot/ios/${build_type}/Aether-${build_type_cap}-Unsigned.ipa" ]]; then
              echo "Godot iOS ${build_type} unsigned IPA not found" >&2
              exit 1
            fi
          done

      - name: Upload Release Unsigned IPA
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ios-release-unsigned-ipa
          path: out/godot/ios/release/Aether-Release-Unsigned.ipa
          retention-days: 7

      - name: Upload App Store IPA
        if: success() && env.IOS_APP_STORE_SIGNING == '1'
        uses: actions/upload-artifact@v7
        with:
          name: ios-release-app-store-ipa
          path: out/godot/ios/release/Aether-App-Store.ipa
          retention-days: 7

      - name: Save ccache
        if: success() && github.event_name != 'pull_request' && steps.restore-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-ios-ccache-v2

  macos:
    name: Build macOS App
    runs-on: macos-14
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      GODOT_RELEASE: 4.7-stable
      GODOT_TEMPLATE_VERSION: 4.7.stable
      AETHERKIRI_MACOS_ARCH: arm64

    steps:
      - name: Verify native ARM runner
        run: test "$(uname -m)" = arm64

      - name: Select Xcode 16.2 for C++20 ranges
        run: |
          test -d /Applications/Xcode_16.2.app
          sudo xcode-select --switch /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: ${{ env.AETHERKIRI_WITH_INTERNAL == 'true' && 'recursive' || 'false' }}
          ssh-key: ${{ env.AETHERKIRI_WITH_INTERNAL == 'true' && secrets.AETHERSECRET || '' }}
          persist-credentials: false

      - name: Set up Rust for Minori
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Resolve private runtime dependency cache
        id: private-runtime-cache-key
        if: env.AETHERKIRI_WITH_INTERNAL == 'true'
        run: |
          key="$(packages/AetherInternal/tools/prepare_ci_dependencies.sh \
            --platform macos --print-cache-key)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore private runtime dependencies
        if: env.AETHERKIRI_WITH_INTERNAL == 'true'
        uses: actions/cache@v5
        with:
          path: packages/AetherInternal/.ci-cache/runtime-dependencies/macos
          key: ${{ runner.os }}-${{ steps.private-runtime-cache-key.outputs.key }}

      - name: Initialize private runtime dependencies
        if: env.AETHERKIRI_WITH_INTERNAL == 'true'
        run: packages/AetherInternal/tools/prepare_ci_dependencies.sh --platform macos

      - name: Initialize public runtime packages
        if: env.AETHERKIRI_WITH_INTERNAL != 'true'
        run: |
          git submodule update --init --depth 1 packages/OnscripterYuri
          git -c submodule.packages/psdfile.url=https://github.com/AetherKiri/psdfile.git \
            submodule update --init --recursive --depth 1 packages/psdfile
          git submodule update --init --depth 1 packages/AetherSiglus

      - name: Set application release version
        if: env.AETHERKIRI_RELEASE_VERSION != ''
        run: |
          release_build_number=$((AETHERKIRI_BUILD_NUMBER * 100 + AETHERKIRI_BUILD_ATTEMPT))
          python3 .github/scripts/set-release-version.py \
            "$AETHERKIRI_RELEASE_VERSION" \
            --build-number "$release_build_number" \
            --github-env "$GITHUB_ENV"

      - name: Check Mac App Store signing configuration
        if: env.AETHERKIRI_RELEASE_VERSION != ''
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_BASE64 }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          configured=0
          [[ -n "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" ]] && configured=$((configured + 1))
          [[ -n "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" ]] && configured=$((configured + 1))
          [[ -n "$MACOS_INSTALLER_CERTIFICATE_BASE64" ]] && configured=$((configured + 1))
          [[ -n "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" ]] && configured=$((configured + 1))
          [[ -n "$MACOS_PROVISIONING_PROFILE_BASE64" ]] && configured=$((configured + 1))
          if [[ "$configured" -ne 5 ]]; then
            echo "Tagged releases require the Apple Distribution certificate plus all three Mac App Store signing secrets." >&2
            exit 1
          fi
          echo "MACOS_APP_STORE_SIGNING=1" >> "$GITHUB_ENV"

      - name: Verify AetherInternal package
        if: env.AETHERKIRI_WITH_INTERNAL == 'true'
        run: |
          set -euo pipefail
          test -f packages/AetherInternal/cmake/AetherInternalConfig.cmake
          git submodule status --recursive

      - name: Install Build Systems
        run: |
          brew install cmake ninja pkg-config autoconf automake autoconf-archive libtool gettext coreutils bison nasm ccache mono
          echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          rustup target add aarch64-apple-darwin

      - name: Install Godot export tools
        run: |
          set -euo pipefail
          mkdir -p .godot "${RUNNER_TEMP}/godot-templates"
          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors \
            -o "${RUNNER_TEMP}/godot-macos.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_macos.universal.zip"
          unzip -tq "${RUNNER_TEMP}/godot-macos.zip"
          unzip -q "${RUNNER_TEMP}/godot-macos.zip" -d .godot
          chmod +x ".godot/Godot.app/Contents/MacOS/Godot"

          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors \
            -o "${RUNNER_TEMP}/godot-export-templates.tpz" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -tq "${RUNNER_TEMP}/godot-export-templates.tpz"
          unzip -q "${RUNNER_TEMP}/godot-export-templates.tpz" -d "${RUNNER_TEMP}/godot-templates"
          template_dir="${HOME}/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "${template_dir}"
          cp -a "${RUNNER_TEMP}/godot-templates/templates/." "${template_dir}/"

          echo "GODOT_BIN=${GITHUB_WORKSPACE}/.godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          echo "GODOT_EXPORT_TEMPLATE=${template_dir}/macos.zip" >> "$GITHUB_ENV"

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-macos-ccache-v2
          restore-keys: |
            ${{ runner.os }}-macos-ccache-

      - name: Setup ccache config
        run: |
          ccache --max-size=400M
          ccache --cleanup
          ccache -z

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          if [[ -d ".devtools/vcpkg" && ! -f ".devtools/vcpkg/.vcpkg-root" ]]; then
            rm -rf .devtools/vcpkg
          fi
          if [[ ! -d ".devtools/vcpkg/.git" ]]; then
            mkdir -p .devtools
            git clone https://github.com/microsoft/vcpkg.git .devtools/vcpkg
          fi
          if [[ ! -x ".devtools/vcpkg/vcpkg" ]]; then
            (cd .devtools/vcpkg && ./bootstrap-vcpkg.sh -disableMetrics)
          fi
          echo "VCPKG_ROOT=${GITHUB_WORKSPACE}/.devtools/vcpkg" >> "$GITHUB_ENV"

      - name: Configure vcpkg binary cache
        env:
          VCPKG_PACKAGES_TOKEN: ${{ github.token }}
        run: bash .github/scripts/configure-vcpkg-binary-cache.sh "$VCPKG_ROOT/vcpkg"

      - name: Restore vcpkg source cache
        id: restore-vcpkg-downloads
        uses: actions/cache/restore@v5
        with:
          path: .devtools/vcpkg/downloads
          key: ${{ runner.os }}-vcpkg-downloads-${{ hashFiles('vcpkg-configuration.json', 'vcpkg.json', 'vcpkg/ports/**', 'vcpkg/triplets/**') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-downloads-

      - name: Build macOS Release
        run: |
          set -euo pipefail
          chmod +x ./build.sh
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          ./build.sh macos release --jobs=4

      - name: Save vcpkg source cache
        if: always() && steps.restore-vcpkg-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .devtools/vcpkg/downloads
          key: ${{ runner.os }}-vcpkg-downloads-${{ hashFiles('vcpkg-configuration.json', 'vcpkg.json', 'vcpkg/ports/**', 'vcpkg/triplets/**') }}

      - name: Build macOS Debug
        run: |
          set -euo pipefail
          chmod +x ./build.sh
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          ./build.sh macos debug --jobs=4

      - name: Run OnscripterYuri Godot smoke test
        env:
          AETHERKIRI_SMOKE_GAME: ${{ github.workspace }}/tests/fixtures/onscripter_smoke
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless \
            --path apps/godot_app \
            --script res://scripts/smoke_test.gd

      - name: Run complete public and integrated private unit tests
        run: |
          set -euo pipefail
          test_build_dir="${GITHUB_WORKSPACE}/out/macos/ci-tests"
          configure_log="${RUNNER_TEMP}/aetherkiri-test-configure.log"

          cmake --preset "MacOS Debug Config" --fresh \
            -B "$test_build_dir" \
            -D ENABLE_TESTS=ON \
            -D BUILD_TOOLS=OFF \
            -D BUILD_ENGINE_API=OFF \
            -D BUILD_GODOT_EXTENSION=OFF \
            -D VCPKG_MANIFEST_INSTALL=OFF \
            -D VCPKG_INSTALLED_DIR="${GITHUB_WORKSPACE}/out/macos/debug/vcpkg_installed" \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            2>&1 | tee "$configure_log"

          if [[ "$AETHERKIRI_WITH_INTERNAL" == "true" ]]; then
            grep -F "AetherInternal E-mote/Live2D package: enabled" "$configure_log"
          else
            grep -F "AetherInternal package: unavailable; using public fallbacks" "$configure_log"
          fi

          cmake --build "$test_build_dir" --parallel 4
          ctest --test-dir "$test_build_dir" --show-only=human
          ctest \
            --test-dir "$test_build_dir" \
            --output-on-failure \
            --no-tests=error \
            --parallel 4

      - name: Verify built .app
        run: |
          set -euo pipefail
          for build_type in release debug; do
            APP_PATH="out/godot/macos/${build_type}/Aether.app"
            if [[ ! -d "$APP_PATH" ]]; then
              echo "Built Godot ${build_type} .app bundle not found: $APP_PATH" >&2
              exit 1
            fi
            app_architectures="$(lipo -archs "$APP_PATH/Contents/MacOS/Aether")"
            if [[ "$app_architectures" != "arm64" ]]; then
              echo "Built Godot ${build_type} macOS app is not arm64-only: $app_architectures" >&2
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
            if [[ "$build_type" == "release" ]]; then
              uses_non_exempt_encryption="$(
                plutil -extract ITSAppUsesNonExemptEncryption raw "$APP_PATH/Contents/Info.plist" \
                  2>/dev/null || true
              )"
              if [[ "$uses_non_exempt_encryption" != "false" ]]; then
                echo "The packaged macOS Release is missing the exempt-encryption declaration." >&2
                exit 1
              fi
              if [[ -n "$AETHERKIRI_RELEASE_VERSION" ]]; then
                info_plist="$APP_PATH/Contents/Info.plist"
                actual_bundle_id="$(plutil -extract CFBundleIdentifier raw "$info_plist")"
                actual_version="$(plutil -extract CFBundleShortVersionString raw "$info_plist")"
                actual_build="$(plutil -extract CFBundleVersion raw "$info_plist")"
                if [[ "$actual_bundle_id" != "$AETHER_IOS_BUNDLE_ID" ||
                      "$actual_version" != "$AETHER_APPLE_VERSION" ||
                      "$actual_build" != "$AETHER_BUILD_NUMBER" ]]; then
                  echo "The packaged macOS release metadata does not match the tag." >&2
                  exit 1
                fi
              fi
              while IFS= read -r -d '' runtime_binary; do
                if file -b "$runtime_binary" | grep -q 'Mach-O' &&
                   xcrun nm -m "$runtime_binary" 2>/dev/null | grep -q 'non-external'; then
                  echo "Local symbols remain in packaged macOS Release binary: $runtime_binary" >&2
                  exit 1
                fi
              done < <(find "$APP_PATH/Contents/MacOS" "$APP_PATH/Contents/Frameworks" -type f -print0)
            fi
          done

      - name: Package Mac App Store installer
        if: env.MACOS_APP_STORE_SIGNING == '1'
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_BASE64 }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          AETHER_APPLE_TEAM_ID: 3JL7FE9XQT
        run: |
          .github/scripts/package-macos-app-store.sh \
            out/godot/macos/release/Aether.app \
            out/godot/macos/app-store

      - name: Upload Release App
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: macos-release-app
          path: out/godot/macos/release/
          retention-days: 7

      - name: Upload Mac App Store installer
        if: success() && env.MACOS_APP_STORE_SIGNING == '1'
        uses: actions/upload-artifact@v7
        with:
          name: macos-release-app-store-pkg
          path: out/godot/macos/app-store/Aether-Mac-App-Store.pkg
          retention-days: 7

      - name: Save ccache
        if: success() && github.event_name != 'pull_request' && steps.restore-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-macos-ccache-v2
