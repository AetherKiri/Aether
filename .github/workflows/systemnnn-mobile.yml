name: SystemNNN mobile link

on:
  pull_request:
    paths:
      - 'packages/SystemNNN-Emberfall'
      - 'abi/**'
      - 'bridge/systemnnn_runtime/**'
      - 'tests/systemnnn_mobile/**'
      - 'vcpkg-configuration.json'
      - 'vcpkg/triplets/**'
      - '.github/workflows/systemnnn-mobile.yml'
  push:
    branches: [main, feat/systemnnn-emberfall, feat/systemnnn-mobile-verify]
    paths:
      - 'packages/SystemNNN-Emberfall'
      - 'abi/**'
      - 'bridge/systemnnn_runtime/**'
      - 'tests/systemnnn_mobile/**'
      - 'vcpkg-configuration.json'
      - 'vcpkg/triplets/**'
      - '.github/workflows/systemnnn-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: systemnnn-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Link ${{ matrix.platform }} arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
            triplet: arm64-android
          - platform: ios
            os: macos-15
            triplet: arm64-ios
    defaults:
      run:
        shell: bash
    env:
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_MAX_CONCURRENCY: '3'
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.systemnnn-mobile-cache
      ANDROID_NDK_VERSION: 28.1.13356709
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize only SystemNNN sources
        run: git submodule update --init --recursive --depth 1 packages/SystemNNN-Emberfall
      - name: Read and verify pinned dependency baseline
        id: baseline
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          baseline = json.loads(Path("vcpkg-configuration.json").read_text())["default-registry"]["baseline"]
          manifest = json.loads(Path("tests/systemnnn_mobile/vcpkg.json").read_text())
          if manifest["builtin-baseline"] != baseline:
              raise SystemExit("Mobile manifest baseline differs from product")
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write(f"commit={baseline}\n")
          PY
      - uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.commit }}
          path: .systemnnn-mobile-vcpkg
          persist-credentials: false
      - name: Install Linux build dependencies
        if: matrix.platform == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config autoconf automake libtool nasm
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk_root="$sdk_root/ndk/$ANDROID_NDK_VERSION"
          if [[ ! -f "$ndk_root/build/cmake/android.toolchain.cmake" ]]; then
            sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$sdkmanager_bin" ]]; then
              echo "Android sdkmanager missing: $sdkmanager_bin" >&2
              exit 1
            fi
            set +o pipefail
            yes | "$sdkmanager_bin" "ndk;$ANDROID_NDK_VERSION"
            sdkmanager_status=${PIPESTATUS[1]}
            set -o pipefail
            if [[ "$sdkmanager_status" -ne 0 ]]; then exit "$sdkmanager_status"; fi
          fi
          test -f "$ndk_root/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=$ndk_root" >> "$GITHUB_ENV"
      - name: Install Apple build dependencies
        if: matrix.platform == 'ios'
        run: |
          brew install cmake ninja pkgconf autoconf automake libtool nasm
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
      - uses: actions/cache/restore@v6
        id: dependencies-cache
        with:
          path: .systemnnn-mobile-cache
          key: systemnnn-mobile-${{ matrix.os }}-${{ matrix.triplet }}-${{ env.ANDROID_NDK_VERSION }}-${{ steps.baseline.outputs.commit }}-${{ hashFiles('tests/systemnnn_mobile/vcpkg.json', 'tests/systemnnn_mobile/triplets/**', 'vcpkg/triplets/**') }}
      - name: Bootstrap isolated vcpkg
        id: bootstrap
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          .systemnnn-mobile-vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Configure native adapter for target
        run: |
          args=()
          if [[ "${{ matrix.platform }}" == android ]]; then
            args+=("-DCMAKE_SYSTEM_NAME=Android" "-DANDROID_ABI=arm64-v8a" "-DANDROID_PLATFORM=android-24" "-DANDROID_STL=c++_shared")
          else
            args+=("-DCMAKE_SYSTEM_NAME=iOS" "-DCMAKE_OSX_SYSROOT=iphoneos" "-DCMAKE_OSX_ARCHITECTURES=arm64"
              "-DCMAKE_OSX_DEPLOYMENT_TARGET=16.0" "-DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO")
          fi
          cmake -S tests/systemnnn_mobile -B build/systemnnn-mobile -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.systemnnn-mobile-vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/tests/systemnnn_mobile/triplets" \
            -DVCPKG_BUILD_TYPE=release \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/build/systemnnn-mobile/vcpkg_installed" \
            "${args[@]}"
      - name: Compile and require complete dependency link
        run: cmake --build build/systemnnn-mobile --parallel 3 --verbose
      - name: Package and inspect target binaries
        run: |
          cmake --install build/systemnnn-mobile --prefix build/systemnnn-mobile/package
          {
            git rev-parse HEAD
            git -C packages/SystemNNN-Emberfall rev-parse HEAD
            git -C .systemnnn-mobile-vcpkg rev-parse HEAD
          } > build/systemnnn-mobile/source-revisions.txt
          if [[ "${{ matrix.platform }}" == android ]]; then
            readelf_bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
            "$readelf_bin" -h -l -d -s build/systemnnn-mobile/package/lib/libsystemnnn-mobile-link.so > build/systemnnn-mobile/binary-inspection.txt
            "$readelf_bin" -h -l -d build/systemnnn-mobile/package/lib/libengine_api.so >> build/systemnnn-mobile/binary-inspection.txt
            python3 tests/systemnnn_mobile/inspect_android.py build/systemnnn-mobile/package "$readelf_bin" > build/systemnnn-mobile/package-inspection.json
          else
            file build/systemnnn-mobile/package/bin/systemnnn-mobile-link > build/systemnnn-mobile/binary-inspection.txt
            lipo -info build/systemnnn-mobile/package/bin/systemnnn-mobile-link >> build/systemnnn-mobile/binary-inspection.txt
            otool -l -L build/systemnnn-mobile/package/bin/systemnnn-mobile-link >> build/systemnnn-mobile/binary-inspection.txt
            nm -g build/systemnnn-mobile/package/bin/systemnnn-mobile-link >> build/systemnnn-mobile/binary-inspection.txt
            python3 tests/systemnnn_mobile/inspect_ios.py build/systemnnn-mobile/package/bin/systemnnn-mobile-link > build/systemnnn-mobile/package-inspection.json
          fi
          cat build/systemnnn-mobile/binary-inspection.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: systemnnn-${{ matrix.platform }}-arm64-link
          if-no-files-found: warn
          path: |
            build/systemnnn-mobile/package
            build/systemnnn-mobile/binary-inspection.txt
            build/systemnnn-mobile/package-inspection.json
            build/systemnnn-mobile/source-revisions.txt
            build/systemnnn-mobile/compile_commands.json
            build/systemnnn-mobile/CMakeCache.txt
            build/systemnnn-mobile/vcpkg_installed/vcpkg/status
            build/systemnnn-mobile/vcpkg-manifest-install.log
            .systemnnn-mobile-vcpkg/buildtrees/ffmpeg/*-out.log
            .systemnnn-mobile-vcpkg/buildtrees/ffmpeg/*-err.log
            .systemnnn-mobile-vcpkg/buildtrees/detect_compiler/stdout-*.log
      - name: Preserve built dependencies even when adapter configuration fails
        if: always() && steps.bootstrap.outcome == 'success' && steps.dependencies-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .systemnnn-mobile-cache
          key: ${{ steps.dependencies-cache.outputs.cache-primary-key }}
