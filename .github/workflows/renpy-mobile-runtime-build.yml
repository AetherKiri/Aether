name: Build Ren'Py Android runtime

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-runtime:
    name: Compile the pinned Ren'Py lifecycle fork
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RENPY_BUILD_ROOT: ${{ github.workspace }}/_renpy-build
      RENPY_OUTPUT_ROOT: ${{ github.workspace }}/out/renpy-mobile-source
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Provision the official Linux build prerequisites
        run: |
          set -euo pipefail
          # This disposable source-build job does not use the host Android SDK,
          # .NET, or Haskell installations. Keep their storage for the rebuild.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/local/swift /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential ccache unzip autoconf autoconf-archive automake \
            libtool-bin pkg-config llvm-18 clang-18 lld-18 python3-dev python3-venv \
            curl python3-jinja2 debootstrap libgmp-dev libmpfr-dev libmpc-dev \
            libssl-dev libbz2-dev liblzma-dev bc cmake ninja-build libassimp-dev \
            libavcodec-dev libavformat-dev libswresample-dev libswscale-dev \
            libharfbuzz-dev libfreetype6-dev libfribidi-dev libsdl2-dev \
            libsdl2-image-dev libjpeg-dev
          /usr/bin/python3 -m venv "${RUNNER_TEMP}/renpy-tools"
          "${RUNNER_TEMP}/renpy-tools/bin/pip" install uv==0.6.17
          echo "${RUNNER_TEMP}/renpy-tools/bin" >> "$GITHUB_PATH"
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - name: Prepare pinned sources and apply the runtime patches
        run: |
          set -euo pipefail
          bash tools/run_renpy_mobile_source_build.sh --mode prepare --fetch \
            --platform android --renpy-build "$RENPY_BUILD_ROOT" \
            --output-dir "$RENPY_OUTPUT_ROOT"
      - name: Supply the official pinned Android NDK
        run: |
          set -euo pipefail
          mkdir -p "$RENPY_BUILD_ROOT/tars"
          ndk_archive="$RENPY_BUILD_ROOT/tars/android-ndk-r29-linux.zip"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r29-linux.zip \
            -o "$ndk_archive"
          # Published by android/ndk's Unsupported-Downloads page.
          printf '87e2bb7e9be5d6a1c6cdf5ec40dd4e0c6d07c30b  %s\n' "$ndk_archive" | sha1sum --check
      - name: Build the native libraries and Python payload
        run: |
          set -euo pipefail
          bash tools/run_renpy_mobile_source_build.sh --mode build \
            --platform android --renpy-build "$RENPY_BUILD_ROOT" \
            --output-dir "$RENPY_OUTPUT_ROOT" 2>&1 | tee "${RUNNER_TEMP}/renpy-source-build.log"
          python3 tools/validate_renpy_mobile_payload.py \
            --platform android \
            --library "$RENPY_OUTPUT_ROOT/payload/rapt/prototype/renpyandroid/src/main/jniLibs/arm64-v8a/librenpython.so" \
            --private-root "$RENPY_OUTPUT_ROOT/payload/rapt/runtime/private"
          tar -C "$RENPY_OUTPUT_ROOT" -czf "${RUNNER_TEMP}/renpy-android-runtime.tar.gz" payload manifest.json
      - name: Upload the compiled runtime for the application build
        uses: actions/upload-artifact@v6
        with:
          name: renpy-android-runtime
          path: ${{ runner.temp }}/renpy-android-runtime.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Preserve source-build evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: renpy-source-build-evidence
          path: |
            ${{ runner.temp }}/renpy-source-build.log
            out/renpy-mobile-source/manifest.json
          if-no-files-found: warn
          retention-days: 7
