name: Ren'Py Desktop Acceptance

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/renpy-desktop.yml'
      - 'bridge/renpy_runtime/**'
      - 'demos/aetherkiri-renpy/**'
      - 'tests/fixtures/renpy_smoke/**'
      - 'tools/install_renpy_sdk.sh'
      - 'tools/run_renpy_smoke.sh'
      - 'tools/test_renpy_demo_fixture.sh'
      - 'tools/test_install_renpy_sdk.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renpy-desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop-sdk:
    name: Ren'Py desktop smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Linux prerequisites
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl tar bzip2 unzip

      - name: Validate installer metadata and shell syntax
        run: bash tools/test_install_renpy_sdk.sh

      - name: Validate Ren'Py demo fixture
        run: bash tools/test_renpy_demo_fixture.sh

      - name: Install pinned Ren'Py SDK and run fixture smoke
        env:
          RENPY_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          sdk_root="${RUNNER_TEMP}/aetherkiri-renpy-sdk"
          bash tools/install_renpy_sdk.sh             --platform "${RENPY_PLATFORM}"             --arch x86_64             --destination "${sdk_root}"
          test -f "${sdk_root}/renpy.sh" || test -f "${sdk_root}/renpy.exe"
          if [[ "${RENPY_RUN_EXECUTION_SMOKE:-0}" != 1 ]]; then
            echo "Ren'Py execution smoke is opt-in; SDK install/integrity matrix passed"
            echo "Set RENPY_RUN_EXECUTION_SMOKE=1 with a built SDK to run run_renpy_smoke.sh"
            exit 0
          fi
          platform_lib_dir="$(find "${sdk_root}/lib" -maxdepth 1 -type d -name 'py3-*' -print -quit 2>/dev/null || true)"
          if [[ -z "${platform_lib_dir}" ]] ||
             ! find "${platform_lib_dir}" -maxdepth 1 -type f \
               \( -name '*.so*' -o -name 'python*' \) -print -quit 2>/dev/null |
               grep -q .; then
            echo "Ren'Py SDK platform files are absent; execution smoke cannot run"
            exit 1
          fi
          RENPY_SDK="${sdk_root}" bash tools/run_renpy_smoke.sh
          AETHERKIRI_RENPY_DEMO_FIXTURE="${GITHUB_WORKSPACE}/demos/aetherkiri-renpy" \
            RENPY_SDK="${sdk_root}" RENPY_DEMO_RUN_SMOKE=1 \
            bash tools/test_renpy_demo_fixture.sh
